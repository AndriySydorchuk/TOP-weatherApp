<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="container">
      <div class="home-view">
        <h1 class="title">Weather App</h1>
        <hr />

        <div class="loading-box hidden">
          <p class="loading-text">Fetching data...</p>
        </div>

        <div class="failed-box hidden">
          <p class="failed-box-text">Failed fetch data for</p>
        </div>

        <input
          type="text"
          placeholder="Enter city name"
          class="city-input"
          id="cityInput"
        />
      </div>

      <div class="info-view hidden">
        <button class="goback-btn" id="gobackBtn">➡</button>
        <h1 class="title">Weather App</h1>
        <hr />

        <div class="general-info">
          <div class="general-info-icon"></div>
          <p class="general-info-temp"></p>
          <p class="general-info-description"></p>
          <div class="general-info-location">
            <div class="general-info-location-icon"></div>
            <p class="general-info-location-text"></p>
          </div>
        </div>
        <hr />

        <div class="add-info">
          <div class="add-info-feelslike">
            <div class="add-info-feelslike-icon"></div>
            <div>
              <p class="add-info-feelslike-text">17°C</p>
              <p>Feels like</p>
            </div>
          </div>

          <div class="add-info-humidity">
            <div class="add-info-humidity-icon"></div>
            <div>
              <p class="add-info-humidity-text">43%</p>
              <p>Humidity</p>
            </div>
          </div>

          <div class="add-info-windspeed">
            <div class="add-info-windspeed-icon"></div>
            <div>
              <p class="add-info-windspeed-text">4.64 m/s</p>
              <p>Wind Speed</p>
            </div>
          </div>

          <p class="add-info-day">Saturday, May 30, 2026</p>
        </div>
      </div>
    </div>
  </body>
</html>
